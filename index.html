<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f6b45">
<title>异界花坊 · 合2花店</title>
<style>
:root{--ink:#123322;--soft:#4f7159;--g0:#1f6b45;--g1:#2f9a63;--g2:#4fd28a;--gold:#ffb524;--rose:#ff6f8a;--sky:#4fb3f0;--cream:#fffaf0;
--sh:0 4px 12px rgba(16,52,32,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#0e3a26;font-family:-apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
body{display:flex;justify-content:center;overflow:hidden}
#app{position:relative;width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;overflow:hidden;
background:
 radial-gradient(115% 44% at 50% -8%,rgba(255,214,120,.55) 0%,rgba(255,214,120,.12) 46%,rgba(255,214,120,0) 72%),
 radial-gradient(90% 40% at 8% 4%,rgba(120,255,190,.22) 0%,rgba(120,255,190,0) 70%),
 url("https://aka.doubaocdn.com/s/1glMMjpwHp") center 86%/cover no-repeat,
 #d9f0d2}
#app>.veil{position:absolute;inset:0;z-index:0;pointer-events:none;
background:linear-gradient(180deg,rgba(255,248,226,.06) 0%,rgba(255,252,238,.16) 20%,rgba(250,255,240,.34) 52%,rgba(240,253,232,.46) 100%)}
#app>*{position:relative;z-index:1}
#app>.veil{z-index:0}

#hud{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 6px 4px}
.st{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.96);border:1.5px solid rgba(255,255,255,.9);border-radius:8px;padding:4px 9px 4px 5px;box-shadow:var(--sh)}
.st svg{width:15px;height:15px;display:block}
.st b{font-size:13.5px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
#up{display:flex;align-items:center;gap:3px;border:0;border-radius:8px;padding:5px 10px 5px 7px;font-size:13px;font-weight:900;color:#fff;
background:linear-gradient(180deg,var(--g2),var(--g1) 48%,var(--g0));box-shadow:0 4px 12px rgba(31,107,69,.36)}
#up svg{width:14px;height:14px}
#up b{color:#fff;font-size:13px;font-variant-numeric:tabular-nums}
#up.hot{background:linear-gradient(180deg,#ffd167,#ffb01f 48%,#e88a0c);box-shadow:0 4px 14px rgba(230,150,20,.45);animation:hotPulse 1.4s ease-in-out infinite}
#up:disabled{background:linear-gradient(180deg,#dfe8dc,#c8d6c6);box-shadow:none;color:#84978a}
#up:disabled b{color:#84978a}
@keyframes hotPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
#lvl{margin-left:auto;font-size:11px;font-weight:900;color:#fff;background:linear-gradient(180deg,#ff8ba4,#f2547a);border-radius:8px;padding:4px 9px;box-shadow:0 3px 10px rgba(242,84,122,.38)}

#orders{flex:0 0 auto;margin:0 6px 4px}
.ol{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:#fff;margin:0 0 4px;font-weight:800;
background:linear-gradient(90deg,rgba(31,107,69,.92),rgba(31,107,69,.62) 70%,rgba(31,107,69,.30));padding:3px 9px;border-radius:6px}
.ol #crit{background:rgba(255,255,255,.92);border-radius:6px;padding:1.5px 7px;color:#b3261e}
.ol .tag2{background:linear-gradient(180deg,#ffe28a,#ffb01f);color:#7a4400;border-radius:6px;padding:1.5px 8px;font-weight:900}
#ord{display:flex;gap:5px}
.order{flex:1;background:rgba(255,255,255,.98);border:1.5px solid rgba(255,255,255,.85);border-radius:9px;padding:7px 4px 8px;box-shadow:var(--sh);min-width:0}
.order .t{font-size:9.5px;color:#587665;display:flex;justify-content:space-between;gap:2px;font-weight:700}
.order .t span:last-child{font-weight:900}
.order .n{display:flex;gap:1px;justify-content:center;align-items:center;margin:2px 0 5px;flex-wrap:wrap;min-height:44px}
.ni{position:relative;width:43px;height:43px;flex:0 0 auto}
.ni i{position:absolute;right:0;bottom:0;font-size:9.5px;font-weight:900;font-style:normal;color:#fff;background:linear-gradient(180deg,#43bd7d,#1f6b45);border-radius:5px;padding:0 3px;line-height:1.45;box-shadow:0 2px 4px rgba(16,52,32,.3)}
.ni i.bad{background:linear-gradient(180deg,#bfcbbc,#94a496)}
.order button{width:100%;border:0;border-radius:7px;color:#fff;font-size:11.5px;font-weight:900;padding:6px 0;letter-spacing:.02em;
background:linear-gradient(180deg,var(--g2),var(--g0));box-shadow:0 3px 9px rgba(31,107,69,.3)}
.order button:disabled{background:linear-gradient(180deg,#ecefe4,#dee5d6);color:#93a094;box-shadow:none}
.order.done{border-color:#7ce0a6;background:linear-gradient(180deg,#f2fff6,#ddf8e6);box-shadow:0 6px 18px rgba(79,210,138,.34)}
.order.done button{background:linear-gradient(180deg,#8ce7b0,#2fa268);box-shadow:0 4px 14px rgba(47,162,104,.44)}
.order .c{font-size:10px;color:#c07000;text-align:center;margin-top:2px;font-weight:900}

#status{flex:0 0 auto;margin:0;padding:3px 8px 4px;background:linear-gradient(90deg,rgba(255,252,240,.9),rgba(255,250,235,.55));border-top:1.5px solid rgba(255,255,255,.8);border-bottom:1.5px solid rgba(31,107,69,.18)}
#s1{font-size:10.5px;font-weight:800;line-height:1.3;color:var(--g0)}
#s2{font-size:9.5px;color:var(--soft);margin-top:1px;line-height:1.3}

#bw{flex:1 1 auto;min-height:0;margin:0;padding:0;display:flex;align-items:center;justify-content:center}
#bd{width:100%;height:100%;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,minmax(0,1fr));gap:0;
background:#3a2718;border:3px solid #2f8f5c;border-radius:0;overflow:hidden;touch-action:none;
box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),0 10px 26px rgba(12,60,38,.34)}
.cell{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0;
background-color:#fff;background-blend-mode:multiply;background-size:130%;background-position:center;
background-image:url("https://aka.doubaocdn.com/s/CURNPD2JC7");
box-shadow:inset 0 0 0 1px rgba(0,0,0,.26)}
.cell.emp{filter:brightness(.84) saturate(.92)}
.cell::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
background:linear-gradient(180deg,rgba(0,0,0,.26),rgba(0,0,0,0) 30%,rgba(255,255,255,.09) 58%,rgba(0,0,0,.30))}
.cell.s0{background-image:url("https://aka.doubaocdn.com/s/CURNPD2JC7")}
.cell.s1{background-image:url("https://aka.doubaocdn.com/s/cXfUtcIa5n")}
.cell.s2{background-image:url("https://aka.doubaocdn.com/s/8dPyn4z0iu")}
.cell.s3{background-image:url("https://aka.doubaocdn.com/s/1ZfG2RtQ7p")}
.cell.s4{background-image:url("https://aka.doubaocdn.com/s/gbDhpkYjUK")}
.cell.bed{background-image:url("https://aka.doubaocdn.com/s/785XMj41hp");box-shadow:inset 0 0 0 2px rgba(255,200,90,.85),inset 0 0 16px rgba(255,190,70,.55)}
.cell.lock{background-image:url("https://aka.doubaocdn.com/s/785XMj41hp");filter:grayscale(.55) brightness(.72)}
.cell .pic{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;will-change:transform}
.aw{position:relative;z-index:1;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.aw>svg{width:100%;height:100%;display:block}
.cell .aw{transform-origin:50% 96%;animation:sway 4.6s ease-in-out infinite;animation-delay:var(--ad,0s)}
@keyframes sway{0%,100%{transform:rotate(-1.5deg) translateX(-.6px)}50%{transform:rotate(1.5deg) translateX(.6px)}}
.sp{position:absolute;inset:2%;width:96%;height:96%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(16,52,32,.20))}
.cell.webbed .pic{filter:saturate(.55) brightness(.9)}
.cell.webbed{background-color:#7e8474}
.cell.webbed::before{background:linear-gradient(180deg,rgba(10,18,8,.5),rgba(10,18,8,.12) 40%,rgba(10,18,8,.55))}
.cell .lv{position:absolute;z-index:3;left:1px;bottom:0;font-size:8px;font-weight:900;color:#1f6b45;background:rgba(255,255,255,.95);border-radius:3px;padding:0 2px;line-height:1.35;box-shadow:0 1px 2px rgba(16,52,32,.16)}
.cell .web{position:absolute;inset:0;pointer-events:none}
.cell .web svg{width:100%;height:100%}
.cell .tag{position:absolute;z-index:3;left:0;right:0;top:1px;text-align:center;font-size:7.5px;font-weight:800;color:#fff2c8;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.65)}

.cell.sel{z-index:4;animation:selPulse 1.1s ease-in-out infinite}
.cell.sel .pic{animation:selBounce .34s cubic-bezier(.34,1.56,.64,1)}
.cell.drag{z-index:6;overflow:visible;box-shadow:inset 0 0 0 1px rgba(0,0,0,.26)}
.cell.drag .pic{filter:drop-shadow(0 10px 14px rgba(6,20,10,.5))}
.cell.drop{box-shadow:inset 0 0 0 3px rgba(140,255,180,.95),inset 0 0 22px rgba(90,255,160,.5)}
.cell.pop .pic{animation:popIn .34s cubic-bezier(.34,1.56,.64,1)}
.cell.pop{animation:popCell .34s ease-out}
.cell.drop2 .pic{animation:dropIn .42s cubic-bezier(.2,1.2,.6,1) both}
@keyframes selPulse{0%,100%{box-shadow:inset 0 0 0 2px rgba(255,235,140,.95)}50%{box-shadow:inset 0 0 0 2px rgba(255,235,140,.95),0 0 0 4px rgba(255,214,90,.55)}}
@keyframes selBounce{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes popIn{0%{transform:scale(.45);opacity:.3}60%{transform:scale(1.16)}100%{transform:scale(1);opacity:1}}
@keyframes popCell{0%{filter:brightness(1.6)}100%{filter:brightness(1)}}
@keyframes dropIn{0%{transform:translateY(-18px) scale(.55);opacity:0}70%{transform:translateY(2px) scale(1.06);opacity:1}100%{transform:none;opacity:1}}

#tools{flex:0 0 auto;display:flex;gap:0;padding:0 0 env(safe-area-inset-bottom)}
#tools button{flex:1;border:0;border-left:1px solid rgba(31,107,69,.16);background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(245,252,244,.9));border-radius:0;padding:9px 0;font-size:11.5px;font-weight:900;color:#1f6b45}
#tools button:first-child{border-left:0}
#tools button:active{background:linear-gradient(180deg,#eafff0,#d2f8df)}

#sheet{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(10,40,26,.5);z-index:60}
#sheet.on{display:flex}
#sb{width:100%;max-width:460px;max-height:80%;overflow:auto;background:#fffdf6;border-radius:12px 12px 0 0;padding:12px 12px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(10,40,26,.3)}
#sb h3{margin:2px 0 8px;font-size:14.5px;color:var(--g0)}
#sb h4{margin:12px 0 6px;font-size:12px;color:var(--g1)}
#sb p{margin:4px 0;font-size:11.5px;line-height:1.6;color:var(--soft)}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed #e4e9d8;font-size:11.5px}
.btn{border:0;background:linear-gradient(180deg,var(--g2),var(--g0));color:#fff;border-radius:8px;padding:8px 13px;font-size:11px;font-weight:900}
.gb{background:#fff;color:#1f6b45;border:1.5px solid #dbe6d6}
#toast{position:fixed;left:50%;bottom:74px;transform:translate(-50%,8px);background:rgba(12,52,34,.95);color:#fff;font-size:11.5px;font-weight:700;padding:8px 14px;border-radius:8px;opacity:0;transition:.22s;z-index:80;pointer-events:none;max-width:86%;text-align:center;box-shadow:0 8px 20px rgba(12,52,34,.35)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-height:700px){#s2{display:none}.ni{width:34px;height:34px}#tools button{padding:7px 0}}
@media (max-height:610px){.order .c{display:none}.ni{width:30px;height:30px}#hud{padding:5px 6px 3px}}
</style>
</head>
<body>
<div id="app">
<div class="veil"></div>
<header id="hud">
  <div class="st"><svg viewBox="0 0 16 16"><path d="M9.6 1.2 L4 9.1h3.1L5.6 14.8 12 6.6H8.7Z" fill="#ffb524"/></svg><b id="e">100</b></div>
  <div class="st"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.6" fill="#ffb524"/><circle cx="8" cy="8" r="4.3" fill="#ffe089"/></svg><b id="c">0</b></div>
  <button id="up"><svg viewBox="0 0 16 16"><path d="M8 13.4V4.2M4.4 7.4 8 3.6l3.6 3.8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><b id="upv">200</b></button>
  <div id="lvl">Lv0</div>
</header>
<section id="orders">
  <div class="ol"><span><span class="tag2">订单</span> 3 槽 · 不超时</span><span id="crit">暴击 8%</span></div>
  <div id="ord"></div>
</section>
<div id="status"><div id="s1">点花圃出花 · 两两合并 · 凑满订单交付</div><div id="s2"></div></div>
<section id="bw"><div id="bd"></div></section>
<footer id="tools">
  <button data-tab="bed">花圃</button><button data-tab="dex">图鉴</button><button data-tab="shop">装修</button><button data-tab="task">任务·设置</button>
</footer>
</div>
<div id="sheet"><div id="sb"></div></div>
<div id="toast"></div>
<script src="app.js" defer></script>
</body>
</html>
